{{- if not .Values.auth.existingSecret }}
{{- $userEnv := mergeOverwrite (deepCopy (.Values.secrets | default dict)) (.Values.env | default dict) }}
{{- $data := dict }}
{{- if not (hasKey $userEnv "TASKHAT_JWT_SECRET") }}
{{- $_ := set $data "jwt-secret" (required "auth.jwtSecret (or env.TASKHAT_JWT_SECRET, or auth.existingSecret) is required" .Values.auth.jwtSecret) }}
{{- end }}
{{- if not (hasKey $userEnv "TASKHAT_DB_URL") }}
{{- $_ := set $data "db-url" (include "taskhat.dbUrl" .) }}
{{- end }}
{{- if not (hasKey $userEnv "TASKHAT_REDIS_URL") }}
{{- $_ := set $data "redis-url" (include "taskhat.redisUrl" .) }}
{{- end }}
{{- if not (hasKey $userEnv "TASKHAT_AMQP_URL") }}
{{- $_ := set $data "amqp-url" (include "taskhat.amqpUrl" .) }}
{{- end }}
{{- if .Values.postgresql.enabled }}
{{- $_ := set $data "postgres-password" .Values.postgresql.auth.password }}
{{- end }}
{{- if .Values.rabbitmq.enabled }}
{{- $_ := set $data "rabbitmq-password" .Values.rabbitmq.auth.password }}
{{- end }}
{{- if and .Values.config.smtpPassword (not (hasKey $userEnv "TASKHAT_SMTP_PASSWORD")) }}
{{- $_ := set $data "smtp-password" .Values.config.smtpPassword }}
{{- end }}
{{- if and .Values.s3.enabled (not (hasKey $userEnv "S3_ACCESS_KEY_ID")) }}
{{- $_ := set $data "s3-access-key-id" .Values.s3.accessKeyId }}
{{- end }}
{{- if and .Values.s3.enabled (not (hasKey $userEnv "S3_SECRET_ACCESS_KEY")) }}
{{- $_ := set $data "s3-secret-access-key" .Values.s3.secretAccessKey }}
{{- end }}
{{- if gt (len $data) 0 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskhat.fullname" . }}
  labels:
    {{- include "taskhat.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- end }}
