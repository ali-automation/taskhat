{{- /* Secret env vars from the free-form secrets: map (dws convention):
       NAME: value pairs stored in a real Kubernetes Secret and loaded into
       api/worker/migrate via envFrom. Explicit env: entries still win
       (container env beats envFrom in Kubernetes). */}}
{{- if .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskhat.fullname" . }}-env
  labels:
    {{- include "taskhat.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.secrets }}
  {{ $name }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
