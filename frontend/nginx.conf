server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths render the app (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
